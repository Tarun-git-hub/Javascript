<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <h1>Number guessing game</h1>
        <p>Try and guess a random number between 1 to 100.</p>
        <p>You have 10 attempt to guess right number.</p>
        <br>
        <form class="form">
            <label for="guessField" id="guess">guess a number</label>
            <input type="text" id="guessField" class="guessField">
            <input type="submit" id="subt" value="Submit guess">
        </form>
        <div class="resultParas">
            <p>previous guess:<span class="guesses"></span></p>
            <p>guess remaining: <span class="lastResult">10</span> </p>
            <p class="lowOrHi"></p>
        </div>
    </div>
</body>
<script src="app.js"></script>
</html>
